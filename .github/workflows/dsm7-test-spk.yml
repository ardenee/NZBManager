name: Build DSM7 password-free test SPK

on:
  workflow_dispatch:
  push:
    tags:
      - 'dsm7-test-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate SPK
        run: python packaging/dsm7/build.py
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: NZB-Manager-DSM7-noauth-test
          path: dist/*.spk
          if-no-files-found: error
